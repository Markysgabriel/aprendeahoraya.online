<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Memória Viva — Contato</title>
  <meta name="description" content="Entre em contato com o Memória Viva."/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<a class="skip" href="#conteudo">Pular para o conteúdo</a>

<header class="nav">
  <div class="container nav-inner">
    <a class="brand" href="index.html"><span class="logo" aria-hidden="true"></span><span>Memória Viva</span></a>
    <button class="menu-btn" data-menu aria-expanded="false" aria-controls="navlinks">Menu</button>
    <nav id="navlinks" class="nav-links" data-links>
      <a href="index.html">Início</a>
      <a href="artigo.html">Artigo</a>
      <a href="recursos.html">Recursos</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
  </div>
</header>

<main id="conteudo" class="section">
  <div class="container">
    <h2>Contato</h2>
    <p class="lead">Deixe sua mensagem. (Este formulário está em modo demonstração.)</p>

    <div class="card">
      <form id="contactForm" class="form" autocomplete="on">
        <input class="input" id="name" name="name" placeholder="Seu nome" />
        <input class="input" id="email" name="email" type="email" placeholder="Seu e-mail" />
        <textarea class="input" id="message" name="message" placeholder="Sua mensagem"></textarea>
        <button class="btn primary" type="submit">Enviar</button>
      </form>

      <div class="hr"></div>

      <div class="note">
        Quer que eu deixe isso <b>enviando de verdade</b>?
        Eu posso integrar com <b>WhatsApp</b>, <b>Google Forms</b> ou um backend simples (Formspree/Netlify).
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div>© <span id="year"></span> Memória Viva</div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
