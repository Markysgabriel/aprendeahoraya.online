<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ======================================================
       1. BASIC PAGE SETTINGS
       Defines language, viewport, title and indexing behavior.
       ====================================================== -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <title>Freedom Benefits</title>

  <!-- Google Font used throughout the page -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    /* ======================================================
       2. COLOR PALETTE
       Change these values to update the page colors.
       ====================================================== */
    :root {
      --navy: #08263d;
      --white: #ffffff;
      --page: #f7f8fb;
      --text: #092e4d;
      --muted: #718095;
      --line: #dfe5eb;
      --blue: #314cff;
      --red: #ff161d;
    }

    /* ======================================================
       3. GLOBAL RESET
       Keeps spacing and sizing consistent across browsers.
       ====================================================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      background: var(--page);
      font-family: "Montserrat", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    button {
      font: inherit;
    }

    /* ======================================================
       4. HEADER
       Contains the logo, brand text and navigation.
       ====================================================== */
    .site-header {
      color: var(--text);
      background: var(--white);
      border-top: 1px solid #111111;
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      width: min(1160px, calc(100% - 40px));
      min-height: 64px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .header-logo {
      width: 54px;
      max-height: 38px;
      object-fit: contain;
    }

    .brand-main-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title {
      display: block;
      color: var(--red);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .brand-arrow {
      color: var(--red);
      font-size: 18px;
      font-weight: 900;
      animation: bounceArrow 1.4s infinite;
    }

    .brand-subtitle {
      display: block;
      margin-top: 2px;
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      opacity: 0.78;
    }

    @keyframes bounceArrow {
      50% {
        transform: translateY(4px);
      }
    }

    /* ======================================================
       5. DESKTOP NAVIGATION
       Visible only on larger screens.
       ====================================================== */
    .desktop-nav {
      display: flex;
      gap: 34px;
      color: var(--text);
      font-weight: 700;
    }

    .desktop-nav a {
      position: relative;
      padding: 8px 0;
    }

    .desktop-nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 3px;
      background: var(--red);
      transition: width 0.2s ease;
    }

    .desktop-nav a:hover::after {
      width: 100%;
    }

    /* ======================================================
       6. MOBILE MENU BUTTON
       Replaces the desktop navigation on smaller screens.
       ====================================================== */
    .menu-toggle {
      display: none;
      width: 46px;
      height: 46px;
      padding: 0;
      border: 0;
      background: transparent;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .menu-toggle span {
      width: 33px;
      height: 3px;
      border-radius: 3px;
      background: var(--text);
      transition: 0.2s ease;
    }

    .menu-toggle.active span:nth-child(1) {
      transform: translateY(9px) rotate(45deg);
    }

    .menu-toggle.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.active span:nth-child(3) {
      transform: translateY(-9px) rotate(-45deg);
    }

    .mobile-menu {
      display: none;
      padding: 0 20px 18px;
      background: var(--white);
      border-top: 1px solid var(--line);
    }

    .mobile-menu.open {
      display: block;
    }

    .mobile-menu a {
      display: block;
      padding: 14px 0;
      color: var(--text);
      font-weight: 700;
      border-top: 1px solid var(--line);
    }

    /* ======================================================
       7. TEXT ABOVE THE VIDEO
       Compact title placed immediately above the VSL.
       ====================================================== */
    .presentation-intro {
      padding: 10px 16px 6px;
      background: var(--white);
      text-align: center;
    }

    .presentation-intro h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(16px, 2.2vw, 22px);
      line-height: 1.2;
      font-weight: 800;
    }

    .presentation-line {
      width: 48px;
      height: 3px;
      margin: 6px auto 0;
      background: var(--red);
    }

    /* ======================================================
       8. VSL SECTION
       Contains the VTurb video player.
       ====================================================== */
    .vsl-section {
      position: relative;
      padding: 2px 20px 82px;
      background: var(--white);
    }

    .vsl-inner {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    .vsl-shell {
      padding: 10px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 24px 60px rgba(8, 38, 61, 0.16);
    }

    .vsl-shell iframe,
    .vsl-shell video,
    .vsl-shell vturb-smartplayer {
      max-width: 100% !important;
    }

    /* ======================================================
       9. DECORATIVE WAVE BELOW THE VIDEO
       Creates the red, white and blue visual transition.
       ====================================================== */
    .wave {
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 100%;
      height: 92px;
      overflow: hidden;
      pointer-events: none;
    }

    .wave svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ======================================================
       10. RESULT / AMOUNT SECTION
       Displays the visitor name and potential amount.
       The visitor name is loaded from localStorage.
       ====================================================== */
    .welcome-banner {
      padding: 34px 20px 42px;
      color: var(--white);
      background: var(--navy);
      text-align: left;
    }

    .welcome-inner {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    .welcome-title {
      margin: 0;
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 500;
    }

    .welcome-title span {
      font-weight: 800;
    }

    .welcome-accent {
      width: 58px;
      height: 4px;
      margin: 12px 0 14px;
      background: var(--red);
    }

    .welcome-label {
      margin: 0;
      color: #d7e1ec;
      font-size: 11px;
      font-weight: 600;
    }

    .welcome-amount {
      margin: 4px 0 0;
      font-size: clamp(34px, 4.5vw, 48px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    /* ======================================================
       11. FOOTER
       Currently empty, but kept for future legal text.
       ====================================================== */
    .site-footer {
      min-height: 22px;
      background: var(--navy);
    }

    /* ======================================================
       12. RESPONSIVE SETTINGS
       Adjusts header, menu, video and text on mobile.
       ====================================================== */
    @media (max-width: 760px) {
      .header-inner {
        width: calc(100% - 24px);
        min-height: 58px;
      }

      .header-logo {
        width: 42px;
        max-height: 30px;
      }

      .brand {
        gap: 12px;
      }

      .brand-title {
        font-size: 14px;
      }

      .brand-arrow {
        font-size: 16px;
      }

      .brand-subtitle {
        margin-top: 1px;
        font-size: 9px;
      }

      .desktop-nav {
        display: none;
      }

      .menu-toggle {
        display: flex;
      }

      .presentation-intro {
        padding: 7px 10px 4px;
      }

      .presentation-intro h1 {
        font-size: 15px;
      }

      .vsl-section {
        padding: 0 8px 68px;
      }

      .vsl-shell {
        padding: 5px;
      }

      .wave {
        height: 72px;
      }

      .welcome-banner {
        padding: 26px 14px 30px;
      }

      .welcome-title {
        font-size: 24px;
      }

      .welcome-amount {
        font-size: 42px;
      }
    }
  </style>

      <button

    </div>

    <!-- Mobile navigation -->
    <nav

      id="mobileMenu"

    >
      <a href="#home">Home</a>

  <main id="home">

       ====================================================== -->

  <script>
    /* ======================================================
       22. MOBILE MENU
       Opens and closes the hamburger navigation.
       ====================================================== */
    const menuToggle = document.getElementById("menuToggle");
    const mobileMenu = document.getElementById("mobileMenu");

    menuToggle.addEventListener("click", function () {
      const isOpen = mobileMenu.classList.toggle("open");

      menuToggle.classList.toggle("active", isOpen);
      menuToggle.setAttribute("aria-expanded", String(isOpen));
    });

    mobileMenu.querySelectorAll("a").forEach(function (link) {
      link.addEventListener("click", function () {
        mobileMenu.classList.remove("open");
        menuToggle.classList.remove("active");
        menuToggle.setAttribute("aria-expanded", "false");
      });
    });

    /* ======================================================
       23. VISITOR NAME
       Reads the name saved on the previous page.
       Expected localStorage keys:
       - userFirstName
       - userFullName
       ====================================================== */
    const savedFirstName = localStorage.getItem("userFirstName");
    const savedFullName = localStorage.getItem("userFullName");
    const visitorName = document.getElementById("visitorName");

    if (savedFirstName) {
      visitorName.textContent = savedFirstName;
    } else if (savedFullName) {
      visitorName.textContent = savedFullName.split(/\s+/)[0];
    }
  </script>
