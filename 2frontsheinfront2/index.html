<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>2 Front</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --black:#000000;
      --white:#ffffff;
      --page:#f5f5f5;
      --line:#dedede;
      --red:#ff2b34;
      --muted:#6c6c6c;
    }

    * {
      box-sizing:border-box;
    }

    html {
      scroll-behavior:smooth;
    }

    body {
      margin:0;
      overflow-x:hidden;
      background:var(--page);
      color:#111;
      font-family:Inter,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    img {
      display:block;
      max-width:100%;
    }

    /* SHEIN HEADER */
    .header {
      background:var(--black);
      color:var(--white);
      box-shadow:0 2px 12px rgba(0,0,0,.18);
    }

    .header-main {
      width:min(1380px,calc(100% - 24px));
      min-height:52px;
      margin:auto;
      display:grid;
      grid-template-columns:auto minmax(240px,520px) auto;
      align-items:center;
      gap:24px;
    }

    .brand {
      font-size:30px;
      line-height:1;
      font-weight:900;
      letter-spacing:.17em;
      user-select:none;
    }

    .search {
      position:relative;
      width:100%;
    }

    .search input {
      width:100%;
      height:32px;
      border:0;
      border-radius:2px;
      padding:0 44px 0 12px;
      background:#fff;
      color:#333;
      font-size:11px;
      outline:none;
    }

    .search button {
      position:absolute;
      right:1px;
      top:1px;
      width:40px;
      height:30px;
      border:0;
      background:#000;
      color:#fff;
      display:grid;
      place-items:center;
      font-size:18px;
    }

    .header-icons {
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:15px;
      font-size:18px;
    }

    .categories {
      border-top:1px solid #292929;
      background:#000;
    }

    .categories-inner {
      width:min(1380px,calc(100% - 24px));
      min-height:35px;
      margin:auto;
      display:flex;
      align-items:center;
      gap:24px;
      overflow:hidden;
      white-space:nowrap;
      font-size:10px;
      font-weight:600;
    }

    /* SALES VIDEO */
    .video-section {
      padding:38px 16px 60px;
      background:linear-gradient(180deg,#fff 0%,#f5f5f5 100%);
    }

    .video-heading {
      width:min(900px,100%);
      margin:0 auto 18px;
      text-align:center;
    }

    .video-heading h1 {
      margin:0;
      font-size:clamp(24px,4.5vw,42px);
      line-height:1.08;
      letter-spacing:-.045em;
      font-weight:900;
    }

    .video-wrap {
      width:min(900px,100%);
      margin:0 auto;
      padding:10px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:0 26px 65px rgba(0,0,0,.15);
    }

    .video-wrap iframe,
    .video-wrap video,
    .video-wrap vturb-smartplayer {
      display:block;
      width:100%!important;
      max-width:100%!important;
      border-radius:8px;
      overflow:hidden;
    }

    /* FOOTER / RESULT */
    .result-footer {
      background:var(--black);
      color:var(--white);
      padding:46px 20px 54px;
    }

    .result-inner {
      width:min(900px,100%);
      margin:0 auto;
    }

    .welcome {
      margin:0;
      font-size:clamp(30px,5vw,52px);
      line-height:1.05;
      font-weight:500;
      letter-spacing:-.045em;
    }

    .welcome strong {
      font-weight:900;
    }

    .accent {
      width:108px;
      height:7px;
      margin:25px 0 24px;
      background:var(--red);
    }

    .amount-label {
      margin:0 0 8px;
      color:#d8d8d8;
      font-size:clamp(14px,2.3vw,20px);
      font-weight:700;
    }

    .amount{
      margin:0;
      font-size:clamp(54px,10vw,92px);
      line-height:.95;
      font-weight:900;
      letter-spacing:-.07em;
      color:#22c55e;
      text-shadow:
        0 0 8px rgba(34,197,94,.35),
        0 0 18px rgba(34,197,94,.20);
      animation:
        moneyAppear .8s ease-out,
        moneyPulse 2s ease-in-out .8s infinite;
    }

    @media(max-width:820px) {
      .header-main {
        min-height:48px;
        grid-template-columns:auto 1fr;
        gap:12px;
      }

      .brand {
        font-size:23px;
      }

      .search {
        display:none;
      }

      .header-icons {
        font-size:16px;
      }

      .categories {
        display:none;
      }

      .video-section {
        padding:24px 8px 42px;
      }

      .video-heading {
        margin-bottom:13px;
      }

      .video-heading h1 {
        font-size:clamp(22px,7vw,31px);
      }

      .video-wrap {
        padding:6px;
        border-radius:10px;
      }

      .result-footer {
        padding:38px 20px 48px;
      }
    }
  
@keyframes moneyPulse{
  0%{transform:scale(1);text-shadow:0 0 8px rgba(34,197,94,.35),0 0 18px rgba(34,197,94,.20);}
  50%{transform:scale(1.05);text-shadow:0 0 18px rgba(34,197,94,.70),0 0 45px rgba(34,197,94,.45);}
  100%{transform:scale(1);text-shadow:0 0 8px rgba(34,197,94,.35),0 0 18px rgba(34,197,94,.20);}
}

@keyframes moneyAppear{
  0%{opacity:0;transform:translateY(20px) scale(.85);}
  60%{opacity:1;transform:translateY(-4px) scale(1.08);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}


    .money-highlight{
      color:#22c55e;
      font-weight:900;
      text-shadow:
        0 0 8px rgba(34,197,94,.35),
        0 0 18px rgba(34,197,94,.25);
      animation:moneyGlow 2s ease-in-out infinite;
    }

    @keyframes moneyGlow{
      0%,100%{
        color:#22c55e;
        text-shadow:
          0 0 8px rgba(34,197,94,.35),
          0 0 18px rgba(34,197,94,.20);
      }
      50%{
        color:#30d158;
        text-shadow:
          0 0 18px rgba(34,197,94,.70),
          0 0 40px rgba(34,197,94,.45);
      }
    }

  </style>
