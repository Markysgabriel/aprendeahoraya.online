	<script type="text/javascript">
document.addEventListener("DOMContentLoaded", function () {

  // ============================================================
  // CONFIG: informe o tempo do pitch (hh:mm:ss OU mm:ss OU segundos)
  // ============================================================
  var TIME_TO_DISPLAY = "00:00:00"; // exemplo: "12:30" | "00:12:30" | 750

  // ============================================================
  // FUNÇÃO: converte tempo para segundos
  // ============================================================
  function convertTimeToSeconds(time) {
    if (typeof time === "number") return time;
    if (typeof time !== "string") return 0;

    const parts = time.split(":").map(p => parseInt(p, 10));
    if (parts.length === 2) { // mm:ss
      const [m, s] = parts;
      return (m * 60) + s;
    }
    if (parts.length === 3) { // hh:mm:ss
      const [h, m, s] = parts;
      return (h * 3600) + (m * 60) + s;
    }
    return 0;
  }

  var SECONDS_TO_DISPLAY = convertTimeToSeconds(TIME_TO_DISPLAY);

  // ============================================================
  // CONFIG: id do bloco de vendas (deve existir no HTML)
  // Ex.: <div id="sales-block" style="display:none">...</div>
  // ============================================================
  var SALES_BLOCK_ID = "sales-block";

  // ============================================================
  // CONFIG: cache (dias) para não esconder de novo depois
  // ============================================================
  var EXPIRATION_DAYS = 14;
  var alreadyDisplayedKey = "alreadyElsDisplayed_" + SECONDS_TO_DISPLAY;

  // ============================================================
  // STORAGE (com expiração)
  // ============================================================
  class StorageHandler {
    static expiryTime = EXPIRATION_DAYS * 86400000;

    static set(key, value) {
      localStorage.setItem(
        key,
        JSON.stringify({ value, expiry: Date.now() + this.expiryTime })
      );
    }

    static get(key) {
      var item = localStorage.getItem(key);
      if (!item) return null;

      var parsed = JSON.parse(item);
      if (!parsed || typeof parsed !== "object") return null;

      var value = parsed.value;
      var expiry = parsed.expiry;

      if (Date.now() > expiry) {
        localStorage.removeItem(key);
        return null;
      }
      return value;
    }
  }

  // ============================================================
  // REVEAL + AUTO-SCROLL (NOVO)
  // - mostra o bloco
  // - rola automaticamente até ele
  // ============================================================
  function revealAndScrollToSalesBlock() {
    const el = document.getElementById(SALES_BLOCK_ID);
    if (!el) return;

    // evita executar várias vezes
    if (el.dataset.revealed === "1") return;
    el.dataset.revealed = "1";

    // mostra o bloco
    el.style.display = "block";
    el.hidden = false;
    el.setAttribute("aria-hidden", "false");

    // salva para próximas visitas (não esconder de novo)
    StorageHandler.set(alreadyDisplayedKey, true);

    // rola até o bloco (com delay pequeno para layout assentar)
    setTimeout(() => {
      el.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 200);
  }

  // ============================================================
  // FUNÇÃO chamada quando chega no tempo (mantém o nome do seu código)
  // ============================================================
  var showHiddenElements = function () {
    revealAndScrollToSalesBlock();
  };

  // ============================================================
  // WATCH PROGRESS DO VÍDEO (Smartplayer)
  // ============================================================
  var attempts = 0;

  var startWatchVideoProgress = function () {
    // espera o smartplayer carregar
    if (typeof smartplayer === "undefined" || !(smartplayer.instances && smartplayer.instances.length)) {
      if (attempts >= 10) return;
      attempts++;
      return setTimeout(startWatchVideoProgress, 1000);
    }

    // escuta o tempo do vídeo
    smartplayer.instances[0].on("timeupdate", () => {
      // se já mostrou, não faz nada
      const sales = document.getElementById(SALES_BLOCK_ID);
      if (sales && sales.dataset.revealed === "1") return;

      // se ainda não chegou no tempo, sai
      if (smartplayer.instances[0].video.currentTime < SECONDS_TO_DISPLAY) return;

      // chegou no tempo: mostra + rola
      showHiddenElements();
    });
  };

  // ============================================================
  // INÍCIO: se já foi mostrado antes (dentro do prazo), mostra direto
  // ============================================================
  var alreadyElsDisplayed = StorageHandler.get(alreadyDisplayedKey);

  if (alreadyElsDisplayed) {
    setTimeout(showHiddenElements, 100);
  } else {
    startWatchVideoProgress();
  }
});
</script>

        document.addEventListener('DOMContentLoaded', () => {
            // Configuração: 3 dias úteis
            const diasParaEntrega = 3; 

            function getDeliveryDate(businessDays) {
                let date = new Date();
                while (businessDays > 0) {
                    date.setDate(date.getDate() + 1);
                    const day = date.getDay();
                    // Pula Sábado (6) e Domingo (0)
                    if (day !== 0 && day !== 6) businessDays--; 
                }
                return date;
            }
